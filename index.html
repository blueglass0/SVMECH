<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Steel Vulture</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b0e11;
        overflow: hidden;
        /* No scrolling, pull-to-refresh, pinch zoom, text selection or callouts while playing. */
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        /* Keep the game clear of notches and rounded corners; the background fills the rest. */
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        height: 100vh;
        height: 100dvh;
      }
      #game {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* The canvas backing size is set in code (render budget); CSS always stretches it to fill. */
      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6f7b85;
        font: 14px/1.4 system-ui, sans-serif;
        letter-spacing: 0.2em;
        text-align: center;
        padding: 16px;
      }
      #boot.failed {
        color: #e86a5a;
        letter-spacing: normal;
      }
      #game canvas {
        cursor: crosshair;
      }
      /* DOM UI over the canvas. */
      .toolbar {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        z-index: 2;
      }
      .toolbar button,
      .tuning button {
        font: 600 12px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #d6dde3;
        background: rgba(20, 26, 31, 0.85);
        border: 1px solid #3a454f;
        border-radius: 6px;
        padding: 9px 11px;
        min-height: 34px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .toolbar button.icon {
        font-size: 16px;
        padding: 6px 10px;
      }
      .toolbar button:hover,
      .tuning button:hover {
        border-color: #e8a33d;
      }
      .tuning {
        position: absolute;
        top: 52px;
        left: 8px;
        z-index: 2;
        display: none;
        width: min(340px, calc(100% - 16px));
        max-height: calc(100% - 64px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px 12px;
        background: rgba(12, 16, 20, 0.92);
        border: 1px solid #3a454f;
        border-radius: 8px;
        color: #c3ccd3;
        font: 12px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        touch-action: pan-y;
      }
      .tuning.open {
        display: block;
      }
      .tuning-title {
        font-weight: 700;
        color: #e8a33d;
        margin-bottom: 6px;
      }
      .tuning-row {
        display: grid;
        grid-template-columns: 1fr 120px 52px;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
      }
      .tuning-row input {
        width: 100%;
        accent-color: #e8a33d;
      }
      .tuning-row output {
        text-align: right;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      .tuning-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        align-items: center;
      }
      .tuning-flash {
        color: #9fe870;
      }
      /* Phones are landscape-only. */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #0b0e11;
        color: #c3ccd3;
        font: 16px/1.5 system-ui, -apple-system, sans-serif;
      }
      #rotate b {
        display: block;
        font-size: 40px;
        color: #e8a33d;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"><div id="boot">LOADING…</div></div>
    <div id="rotate"><div><b>⟳</b>Rotate your phone to landscape</div></div>
    <script>
      // If the game never starts (script failed to load, old browser, wrong Pages source),
      // say so instead of showing LOADING forever. main.ts removes #boot when it runs.
      (function () {
        function fail(why) {
          var el = document.getElementById('boot');
          if (!el) return;
          el.className = 'failed';
          el.textContent = 'The game failed to start: ' + why + '. Try reloading the page.';
        }
        window.addEventListener('error', function (e) {
          var src = e.target && e.target.src;
          fail(src ? 'could not load ' + src : e.message || 'script error');
        }, true);
        setTimeout(function () { fail('it took longer than 15 seconds'); }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
